{% extends 'base.html' %}
{% block title %}Server Error (500) - MediFind{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <div style="font-size: 4rem; color: var(--warning); margin-bottom: 1rem;">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>
  <h1 style="font-size: 2.2rem; margin-bottom: 0.75rem;">Internal Server Error</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem;">
    An unexpected error occurred while processing your request. Please try again shortly.
  </p>
  <a href="{{ url_for('customer.home') }}" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
