<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediFind - Find Medicine & Verified Pharmacies</title>
  <meta name="description" content="Search medicines and discover nearby verified pharmacies with real-time stock availability, instant order fulfillment, and verified prescription delivery.">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core App Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <style>
    .search-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      padding: 2.5rem 0 4rem;
    }
    .filter-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      height: fit-content;
      position: sticky;
      top: 90px;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      display: block;
      margin-bottom: 0.4rem;
    }
    .form-control {
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
      background: #ffffff;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .badge-success {
      background: #dcfce7;
      color: #15803d;
    }
    .badge-warning {
      background: #fef3c7;
      color: #b45309;
    }
    .med-search-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 1.5rem;
    }
    .med-search-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }
    .pharm-stock-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-md);
      font-size: 0.78rem;
      margin-right: 0.35rem;
      margin-bottom: 0.35rem;
    }
    @media (max-width: 850px) {
      .search-layout {
        grid-template-columns: 1fr;
      }
      .med-search-card {
        grid-template-columns: 1fr;
      }
      .filter-card {
        position: static;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">
          <i class="fa-solid fa-staff-snake"></i>
        </div>
        <span>MediFind</span>
      </a>

      <!-- Merged Navigation: Only Home Button -->
      <nav class="nav-links">
        <a href="index.html" class="nav-link active">Home</a>
      </nav>

      <div class="nav-actions">
        <button class="btn btn-outline btn-sm">Login</button>
        <button class="btn btn-primary btn-sm">Register</button>
      </div>
    </div>
  </header>

  <!-- Clean Hero Section -->
  <main class="main-content" style="padding: 3rem 0 1.5rem;">
    <section class="hero-section" id="find-medicine">
      <div class="container">
        
        <h1 class="hero-title">
          Find your medicine.<br>
          Find a <span>verified pharmacy</span>.
        </h1>

        <!-- Hero Search Bar -->
        <div class="hero-search-wrapper" style="max-width: 720px; margin: 0 auto;">
          <form class="hero-search-form" id="hero-search-form" onsubmit="handleHeroSearch(event)">
            <div class="search-input-group">
              <i class="fa-solid fa-magnifying-glass search-icon"></i>
              <input 
                type="text" 
                id="hero-search-input"
                name="q" 
                class="search-input" 
                placeholder="Search medicine, generic name (e.g. Paracetamol, Amoxicillin, Metformin)..." 
                autocomplete="off" 
                aria-label="Search medicine"
                oninput="syncHeroSearch(this.value)"
              >
            </div>
          </form>
        </div>

      </div>
    </section>
  </main>

  <!-- Complete Find Medicine & Stock Finder Section on Home Page -->
  <div class="container search-layout" id="catalog-section">
    
    <!-- Left Filter Sidebar -->
    <aside class="filter-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
        <h3 style="font-size:1.15rem; margin:0;"><i class="fa-solid fa-filter text-primary"></i> Filter Medicines</h3>
        <button type="button" onclick="resetFilters()" style="background:none; border:none; color:var(--primary); font-size:0.8rem; font-weight:700; cursor:pointer;">Reset</button>
      </div>

      <!-- Search Input in Filter -->
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">Search Query</label>
        <div style="position:relative;">
          <input type="text" id="filter-query" class="form-control" placeholder="Brand or generic name..." oninput="syncFilterToHero(this.value)">
        </div>
      </div>

      <!-- Stock Availability Filter -->
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">Availability</label>
        <div style="display:flex; flex-direction:column; gap:0.4rem; font-size:0.88rem;">
          <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
            <input type="radio" name="stock-filter" value="ALL" checked onchange="applyFilters()"> All Items
          </label>
          <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
            <input type="radio" name="stock-filter" value="IN_STOCK" onchange="applyFilters()"> In Stock Only
          </label>
          <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
            <input type="radio" name="stock-filter" value="OTC_ONLY" onchange="applyFilters()"> OTC (No Prescription)
          </label>
        </div>
      </div>

      <!-- Category Filter -->
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">Category</label>
        <select id="filter-category" class="form-control" onchange="applyFilters()">
          <option value="ALL">All Categories</option>
          <option value="Antibiotics">Antibiotics</option>
          <option value="Pain Relief & Fever">Pain Relief & Fever</option>
          <option value="Diabetes Care">Diabetes Care</option>
          <option value="Cardiovascular">Cardiovascular</option>
          <option value="Vitamins & Supplements">Vitamins & Supplements</option>
          <option value="Allergy & Cold">Allergy & Cold</option>
          <option value="Gastrointestinal">Gastrointestinal</option>
          <option value="Respiratory">Respiratory</option>
        </select>
      </div>

      <!-- Max Price Filter -->
      <div class="form-group" style="margin-bottom:1.5rem;">
        <div style="display:flex; justify-content:space-between; margin-bottom:0.25rem;">
          <label class="form-label" style="margin-bottom:0;">Max Price</label>
          <span id="price-val-label" style="font-size:0.85rem; font-weight:700; color:var(--primary);">₹50.00</span>
        </div>
        <input type="range" id="filter-price" min="2" max="50" step="1" value="50" style="width:100%; cursor:pointer;" oninput="document.getElementById('price-val-label').textContent = '₹' + parseFloat(this.value).toFixed(2); applyFilters();">
      </div>
    </aside>

    <!-- Right Results Section -->
    <section>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
        <div>
          <h2 style="font-size:1.6rem; margin-bottom:0.25rem;">Medicine Catalog & Stock Finder</h2>
          <p id="results-count-text" style="color:var(--text-muted); font-size:0.9rem; margin:0;">Loading available medicines...</p>
        </div>
        
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <label style="font-size:0.85rem; color:var(--text-muted); white-space:nowrap;">Sort By:</label>
          <select id="sort-select" class="form-control" style="width:auto; padding:0.4rem 0.8rem; font-size:0.85rem;" onchange="applyFilters()">
            <option value="POPULAR">Most Popular</option>
            <option value="PRICE_LOW">Price: Low to High</option>
            <option value="PRICE_HIGH">Price: High to Low</option>
            <option value="NAME">Name: A to Z</option>
          </select>
        </div>
      </div>

      <div id="search-results-list">
        <!-- Rendered by JavaScript -->
      </div>
    </section>

  </div>

  <script>
    const MEDICINES_DATA = [
      {
        id: 1,
        name: 'Amoxicillin 500mg',
        genericName: 'Amoxicillin Trihydrate',
        brandName: 'Amoxil / Novamox',
        category: 'Antibiotics',
        dosageForm: 'Capsule',
        strength: '500 mg',
        price: 12.50,
        requiresPrescription: true,
        description: 'Broad-spectrum penicillin antibiotic used to treat bacterial infections of the ear, nose, throat, urinary tract, and skin.',
        manufacturer: 'Cipla Ltd.',
        stocks: { 'Apollo HealthCare': 45, 'MedPlus 24x7': 18, 'Wellness Forever': 0 }
      },
      {
        id: 2,
        name: 'Paracetamol 650mg',
        genericName: 'Acetaminophen / Paracetamol',
        brandName: 'Dolo 650 / Calpol',
        category: 'Pain Relief & Fever',
        dosageForm: 'Tablet',
        strength: '650 mg',
        price: 3.20,
        requiresPrescription: false,
        description: 'Analgesic and antipyretic medication used to relieve mild to moderate pain and reduce high fever quickly.',
        manufacturer: 'Micro Labs Ltd.',
        stocks: { 'Apollo HealthCare': 200, 'MedPlus 24x7': 150, 'Wellness Forever': 80 }
      },
      {
        id: 3,
        name: 'Metformin 500mg',
        genericName: 'Metformin Hydrochloride',
        brandName: 'Glucophage / Glycomet',
        category: 'Diabetes Care',
        dosageForm: 'Tablet',
        strength: '500 mg',
        price: 8.75,
        requiresPrescription: true,
        description: 'First-line medication for the treatment of type 2 diabetes, helping control blood sugar levels.',
        manufacturer: 'USV Pvt Ltd.',
        stocks: { 'Apollo HealthCare': 65, 'MedPlus 24x7': 0, 'Wellness Forever': 30 }
      },
      {
        id: 4,
        name: 'Atorvastatin 20mg',
        genericName: 'Atorvastatin Calcium',
        brandName: 'Lipitor / Storvas',
        category: 'Cardiovascular',
        dosageForm: 'Tablet',
        strength: '20 mg',
        price: 15.00,
        requiresPrescription: true,
        description: 'Statin medication used to prevent cardiovascular disease and treat abnormal lipid / cholesterol levels.',
        manufacturer: 'Sun Pharma Ltd.',
        stocks: { 'Apollo HealthCare': 30, 'MedPlus 24x7': 50, 'Wellness Forever': 12 }
      },
      {
        id: 5,
        name: 'Cetirizine 10mg',
        genericName: 'Cetirizine Dihydrochloride',
        brandName: 'Zyrtec / Cetzine',
        category: 'Allergy & Cold',
        dosageForm: 'Tablet',
        strength: '10 mg',
        price: 4.50,
        requiresPrescription: false,
        description: 'Second-generation antihistamine used to relieve allergy symptoms such as watery eyes, runny nose, and sneezing.',
        manufacturer: 'Dr. Reddy\'s Laboratories',
        stocks: { 'Apollo HealthCare': 120, 'MedPlus 24x7': 90, 'Wellness Forever': 45 }
      },
      {
        id: 6,
        name: 'Azithromycin 500mg',
        genericName: 'Azithromycin Monohydrate',
        brandName: 'Zithromax / Azithral',
        category: 'Antibiotics',
        dosageForm: 'Tablet',
        strength: '500 mg',
        price: 18.00,
        requiresPrescription: true,
        description: 'Macrolide antibiotic used for respiratory tract infections, pneumonia, and strep throat infections.',
        manufacturer: 'Alembic Pharmaceuticals',
        stocks: { 'Apollo HealthCare': 0, 'MedPlus 24x7': 24, 'Wellness Forever': 15 }
      },
      {
        id: 7,
        name: 'Vitamin D3 60,000 IU',
        genericName: 'Cholecalciferol',
        brandName: 'Calcirol / Uprise D3',
        category: 'Vitamins & Supplements',
        dosageForm: 'Softgel Capsule',
        strength: '60,000 IU',
        price: 9.50,
        requiresPrescription: false,
        description: 'High-potency Vitamin D3 supplement for bone strength, calcium absorption, and immune support.',
        manufacturer: 'Cadila Healthcare',
        stocks: { 'Apollo HealthCare': 150, 'MedPlus 24x7': 110, 'Wellness Forever': 95 }
      },
      {
        id: 8,
        name: 'Pantoprazole 40mg',
        genericName: 'Pantoprazole Sodium',
        brandName: 'Pantocid / Pantop',
        category: 'Gastrointestinal',
        dosageForm: 'Tablet',
        strength: '40 mg',
        price: 7.20,
        requiresPrescription: true,
        description: 'Proton pump inhibitor (PPI) that decreases stomach acid production for acidity, GERD, and ulcers.',
        manufacturer: 'Sun Pharma Ltd.',
        stocks: { 'Apollo HealthCare': 85, 'MedPlus 24x7': 60, 'Wellness Forever': 40 }
      },
      {
        id: 9,
        name: 'Salbutamol Inhaler 100mcg',
        genericName: 'Albuterol / Salbutamol',
        brandName: 'Ventolin / Asthalin',
        category: 'Respiratory',
        dosageForm: 'Inhaler',
        strength: '100 mcg/dose',
        price: 14.80,
        requiresPrescription: true,
        description: 'Fast-acting bronchodilator for rapid relief of bronchospasm in asthma and COPD attacks.',
        manufacturer: 'Cipla Ltd.',
        stocks: { 'Apollo HealthCare': 40, 'MedPlus 24x7': 20, 'Wellness Forever': 0 }
      },
      {
        id: 10,
        name: 'Ibuprofen 400mg',
        genericName: 'Ibuprofen',
        brandName: 'Brufen / Advil',
        category: 'Pain Relief & Fever',
        dosageForm: 'Tablet',
        strength: '400 mg',
        price: 5.10,
        requiresPrescription: false,
        description: 'Nonsteroidal anti-inflammatory drug (NSAID) for inflammation, headaches, dental pain, and muscular stiffness.',
        manufacturer: 'Abbott Healthcare',
        stocks: { 'Apollo HealthCare': 180, 'MedPlus 24x7': 75, 'Wellness Forever': 130 }
      }
    ];

    function handleHeroSearch(e) {
      e.preventDefault();
      const q = document.getElementById('hero-search-input').value.trim();
      document.getElementById('filter-query').value = q;
      applyFilters();
      const catalogEl = document.getElementById('catalog-section');
      if (catalogEl) {
        catalogEl.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function syncHeroSearch(val) {
      document.getElementById('filter-query').value = val;
      applyFilters();
    }

    function syncFilterToHero(val) {
      document.getElementById('hero-search-input').value = val;
      applyFilters();
    }

    function resetFilters() {
      document.getElementById('hero-search-input').value = '';
      document.getElementById('filter-query').value = '';
      document.getElementById('filter-category').value = 'ALL';
      document.getElementById('filter-price').value = '50';
      document.getElementById('price-val-label').textContent = '₹50.00';
      document.querySelector('input[name="stock-filter"][value="ALL"]').checked = true;
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('filter-query').value.trim().toLowerCase();
      const cat = document.getElementById('filter-category').value;
      const maxPrice = parseFloat(document.getElementById('filter-price').value);
      const stockFilter = document.querySelector('input[name="stock-filter"]:checked').value;
      const sortBy = document.getElementById('sort-select').value;

      let filtered = MEDICINES_DATA.filter(med => {
        const matchText = !q || 
          med.name.toLowerCase().includes(q) || 
          med.genericName.toLowerCase().includes(q) || 
          (med.brandName && med.brandName.toLowerCase().includes(q)) ||
          med.category.toLowerCase().includes(q);

        const matchCat = cat === 'ALL' || med.category.toLowerCase() === cat.toLowerCase();
        const matchPrice = med.price <= maxPrice;

        let totalStock = 0;
        if (med.stocks) {
          Object.values(med.stocks).forEach(qty => { totalStock += qty; });
        }

        let matchStock = true;
        if (stockFilter === 'IN_STOCK') matchStock = totalStock > 0;
        if (stockFilter === 'OTC_ONLY') matchStock = !med.requiresPrescription;

        return matchText && matchCat && matchPrice && matchStock;
      });

      if (sortBy === 'PRICE_LOW') filtered.sort((a, b) => a.price - b.price);
      else if (sortBy === 'PRICE_HIGH') filtered.sort((a, b) => b.price - a.price);
      else if (sortBy === 'NAME') filtered.sort((a, b) => a.name.localeCompare(b.name));

      renderResults(filtered);
    }

    function renderResults(medicines) {
      const container = document.getElementById('search-results-list');
      const countText = document.getElementById('results-count-text');

      countText.textContent = `Found ${medicines.length} matching medicine(s)`;

      if (medicines.length === 0) {
        container.innerHTML = `
          <div style="background:#ffffff; border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:3rem 1.5rem; text-align:center;">
            <i class="fa-solid fa-magnifying-glass text-muted" style="font-size:2.5rem; margin-bottom:1rem;"></i>
            <h3>No medicines match your search criteria</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Try adjusting your filters or searching for a generic name.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = medicines.map(med => {
        return `
          <div class="med-search-card" style="display:block; padding:1.25rem 1.5rem;">
            <h3 style="font-size:1.25rem; margin-bottom:0.35rem; color:var(--text-main); font-weight:700;">${med.name}</h3>
            <p style="font-size:0.9rem; color:var(--text-muted); margin:0; line-height:1.5;">
              <strong>Generic:</strong> ${med.genericName} &bull; <strong>Brand:</strong> ${med.brandName || 'Standard'} &bull; <strong>Mfg:</strong> ${med.manufacturer}
            </p>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyFilters();
    });
  </script>
</body>
</html>
