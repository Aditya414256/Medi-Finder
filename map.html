<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacy Map Explorer - MediFind</title>
  <meta name="description" content="Discover verified partner pharmacies on our interactive map with real-time open hours, contact info, and stock inventory.">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <link rel="stylesheet" href="homepage/style.css">
  <link rel="stylesheet" href="static/css/medifind-theme.css">

  <style>
    .map-page-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: calc(100vh - 72px);
      overflow: hidden;
    }
    .pharm-sidebar {
      background: #ffffff;
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .pharm-sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-main);
    }
    .pharm-list-item {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: var(--transition);
    }
    .pharm-list-item:hover, .pharm-list-item.active {
      background: var(--primary-light);
      border-left: 4px solid var(--primary);
    }
    #main-interactive-map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    @media (max-width: 850px) {
      .map-page-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      #main-interactive-map {
        height: 450px;
      }
    }
  </style>
</head>
<body style="background:var(--bg-main); min-height:100vh; display:flex; flex-direction:column;">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-staff-snake"></i></div>
        <span>MediFind</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="map.html" class="nav-link active">Pharmacies Map</a>
      </nav>

      <div class="nav-actions">
        <!-- Cart Button -->
        <a href="javascript:void(0)" class="btn btn-outline btn-sm" data-action="open-cart" title="View Cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>Cart</span>
          <span class="cart-badge-count" style="display:none;">0</span>
        </a>

        <!-- Dynamic Auth Slot -->
        <div data-auth-slot style="display:inline-flex; align-items:center; gap:0.5rem;">
          <button type="button" class="btn btn-outline btn-sm" onclick="MediUI.openModal('login-modal')">Login</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="MediUI.openModal('register-choice-modal')">Register</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Map Explorer Layout -->
  <div class="map-page-layout">
    
    <!-- Sidebar List -->
    <aside class="pharm-sidebar">
      <div class="pharm-sidebar-header">
        <h3 style="font-size:1.15rem; margin-bottom:0.4rem; color:var(--text-main);">
          <i class="fa-solid fa-map-pin text-primary"></i> Nearby Pharmacies
        </h3>
        <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
          <button type="button" class="btn btn-outline btn-sm" style="font-size:0.75rem; flex:1;" onclick="locateUserOnMap()">
            <i class="fa-solid fa-location-crosshairs text-primary"></i> My Location
          </button>
          <button type="button" class="btn btn-outline btn-sm" style="font-size:0.75rem; flex:1;" onclick="toggle24x7Filter()">
            <i class="fa-solid fa-clock text-info"></i> 24x7 Only
          </button>
        </div>
      </div>

      <div id="pharmacy-sidebar-list" style="flex:1;">
        <!-- Dynamically rendered -->
      </div>
    </aside>

    <!-- Interactive Map Container -->
    <main style="position:relative;">
      <div id="main-interactive-map"></div>
    </main>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="static/js/medifind-engine.js"></script>
  <script>
    let mapInstance = null;
    let markers = [];
    let only24x7 = false;

    function initMap() {
      mapInstance = L.map('main-interactive-map').setView([28.6139, 77.2090], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(mapInstance);

      renderPharmaciesList();
    }

    function toggle24x7Filter() {
      only24x7 = !only24x7;
      renderPharmaciesList();
      MediUI.showToast(only24x7 ? 'Filtering by 24x7 Pharmacies only' : 'Showing all verified pharmacies', 'info');
    }

    function renderPharmaciesList() {
      const container = document.getElementById('pharmacy-sidebar-list');
      let pharmacies = MediStore.getPharmacies();

      if (only24x7) {
        pharmacies = pharmacies.filter(p => p.is24x7);
      }

      // Clear existing markers
      markers.forEach(m => mapInstance.removeLayer(m));
      markers = [];

      container.innerHTML = pharmacies.map(pharm => `
        <div class="pharm-list-item" id="pharm-item-${pharm.id}" onclick="focusPharmacy(${pharm.id}, ${pharm.latitude}, ${pharm.longitude})">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.25rem;">
            <h4 style="font-size:1.05rem; margin:0; color:var(--text-main);">${pharm.name}</h4>
            <span style="font-size:0.8rem; font-weight:700; color:#d97706;"><i class="fa-solid fa-star"></i> ${pharm.rating}</span>
          </div>

          <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.4rem;">
            <i class="fa-solid fa-location-dot text-primary" style="margin-right:0.25rem;"></i> ${pharm.address}
          </p>

          <div style="display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:0.6rem;">
            ${pharm.status === 'APPROVED' ? '<span class="badge badge-success" style="font-size:0.7rem;"><i class="fa-solid fa-check"></i> Verified</span>' : '<span class="badge badge-warning" style="font-size:0.7rem;">Pending</span>'}
            ${pharm.is24x7 ? '<span class="badge badge-info" style="font-size:0.7rem;"><i class="fa-solid fa-clock"></i> 24x7</span>' : ''}
            ${pharm.homeDelivery ? '<span class="badge badge-secondary" style="font-size:0.7rem;"><i class="fa-solid fa-truck"></i> Delivery</span>' : ''}
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.78rem;">
            <span style="color:var(--text-muted);"><i class="fa-solid fa-phone"></i> ${pharm.phone}</span>
            <a href="search.html" style="font-weight:700; color:var(--primary);">View Inventory &rarr;</a>
          </div>
        </div>
      `).join('');

      // Add pins to map
      pharmacies.forEach(pharm => {
        const marker = L.marker([pharm.latitude, pharm.longitude]).addTo(mapInstance);
        marker.bindPopup(`
          <div style="min-width:200px; padding:0.25rem;">
            <strong style="color:#0284c7; font-size:1rem; display:block; margin-bottom:0.25rem;">${pharm.name}</strong>
            <p style="font-size:0.8rem; color:#64748b; margin:0 0 0.4rem;">${pharm.address}</p>
            <div style="font-size:0.78rem; color:#059669; font-weight:700; margin-bottom:0.5rem;">
              <i class="fa-solid fa-clock"></i> ${pharm.openHours}
            </div>
            <a href="search.html" class="btn btn-primary btn-sm" style="font-size:0.78rem; display:block; text-align:center; color:#fff !important;">
              Browse Stock
            </a>
          </div>
        `);
        markers.push(marker);
      });
    }

    function focusPharmacy(id, lat, lng) {
      document.querySelectorAll('.pharm-list-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`pharm-item-${id}`);
      if (activeEl) activeEl.classList.add('active');

      if (mapInstance) {
        mapInstance.flyTo([lat, lng], 15, { animate: true, duration: 1.2 });
      }
    }

    function locateUserOnMap() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const userLat = pos.coords.latitude;
            const userLon = pos.coords.longitude;
            mapInstance.flyTo([userLat, userLon], 14);
            const userMarker = L.circleMarker([userLat, userLon], {
              radius: 9,
              fillColor: '#0284c7',
              color: '#ffffff',
              weight: 3,
              opacity: 1,
              fillOpacity: 0.9
            }).addTo(mapInstance);
            userMarker.bindPopup('<strong>Your Current Location</strong>').openPopup();
            MediUI.showToast('Centered map on your current location!', 'success');
          },
          () => {
            mapInstance.flyTo([28.6139, 77.2090], 14);
            MediUI.showToast('Using default central location.', 'info');
          }
        );
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(initMap, 200);
    });
  </script>
</body>
</html>
