<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration - MediFind</title>
  <meta name="description" content="Register as a customer on MediFind to find medicines, verify pharmacy stocks, and track prescriptions.">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="homepage/style.css">
  <link rel="stylesheet" href="static/css/medifind-theme.css">
</head>
<body style="background:var(--bg-main); min-height:100vh; display:flex; flex-direction:column;">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-staff-snake"></i></div>
        <span>MediFind</span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:2.5rem 1rem;">
    <div style="width:100%; max-width:500px; background:#ffffff; border:1px solid var(--border-color); border-radius:var(--radius-lg); box-shadow:var(--shadow-xl); padding:2rem 2rem;">
      
      <div style="text-align:center; margin-bottom:1.5rem;">
        <div class="brand-icon" style="margin:0 auto 1rem; width:48px; height:48px; font-size:1.3rem;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2 style="font-size:1.6rem; margin-bottom:0.35rem; color:var(--text-main);">Customer Registration</h2>
        <p style="color:var(--text-muted); font-size:0.88rem;">Create your patient account to order medicines and track prescriptions.</p>
      </div>

      <form id="reg-cust-page-form" onsubmit="handleCustomerPageRegister(event)">
        <div class="form-group">
          <label class="form-label" for="cust-name">Full Name</label>
          <input type="text" id="cust-name" class="form-control" placeholder="e.g. Alex Morgan" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="cust-email">Email Address</label>
          <input type="email" id="cust-email" class="form-control" placeholder="alex@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="cust-phone">Phone Number</label>
          <input type="tel" id="cust-phone" class="form-control" placeholder="+1-555-0199" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="cust-address">Delivery Address</label>
          <input type="text" id="cust-address" class="form-control" placeholder="Street Address, City, Postal Code" required>
        </div>

        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label" for="cust-password">Password (min 6 characters)</label>
          <input type="password" id="cust-password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
          <i class="fa-solid fa-user-check"></i> Complete Account Registration
        </button>
      </form>

      <div style="text-align:center; font-size:0.88rem; color:var(--text-muted); margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border-color);">
        Already have an account? <a href="login.html" style="font-weight:700; color:var(--primary);">Sign In</a> | <a href="register_pharmacy.html" style="font-weight:700; color:var(--accent);">Register Pharmacy</a>
      </div>

    </div>
  </main>

  <script src="static/js/medifind-engine.js"></script>
  <script>
    function handleCustomerPageRegister(e) {
      e.preventDefault();
      const name = document.getElementById('cust-name').value.trim();
      const email = document.getElementById('cust-email').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const password = document.getElementById('cust-password').value;

      const res = MediAuth.registerCustomer({ name, email, phone, address, password });
      if (res.success) {
        MediUI.showToast(`Account created successfully! Welcome, ${res.user.name}.`, 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } else {
        MediUI.showToast(res.message, 'error');
      }
    }
  </script>
</body>
</html>
