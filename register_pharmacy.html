<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacy Store Registration - MediFind</title>
  <meta name="description" content="Register your licensed pharmacy store on MediFind to receive prescription orders and manage live stock.">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="homepage/style.css">
  <link rel="stylesheet" href="static/css/medifind-theme.css">
</head>
<body style="background:var(--bg-main); min-height:100vh; display:flex; flex-direction:column;">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-staff-snake"></i></div>
        <span>MediFind</span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:2.5rem 1rem;">
    <div style="width:100%; max-width:600px; background:#ffffff; border:1px solid var(--border-color); border-radius:var(--radius-lg); box-shadow:var(--shadow-xl); padding:2rem 2.25rem;">
      
      <div style="text-align:center; margin-bottom:1.5rem;">
        <div class="brand-icon" style="margin:0 auto 1rem; width:48px; height:48px; font-size:1.3rem; background:linear-gradient(135deg, #059669 0%, #047857 100%);">
          <i class="fa-solid fa-prescription-bottle-medical"></i>
        </div>
        <h2 style="font-size:1.6rem; margin-bottom:0.35rem; color:var(--text-main);">Pharmacy Partner Registration</h2>
        <p style="color:var(--text-muted); font-size:0.88rem;">List your pharmacy, upload your drug license, and join the verified network.</p>
      </div>

      <form id="reg-pharm-page-form" onsubmit="handlePharmacyPageRegister(event)">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.85rem; margin-bottom:0.85rem;">
          <div class="form-group">
            <label class="form-label" for="pharm-name">Pharmacy Store Name</label>
            <input type="text" id="pharm-name" class="form-control" placeholder="e.g. Apex Health Pharmacy" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="pharm-owner">Pharmacist / Owner Name</label>
            <input type="text" id="pharm-owner" class="form-control" placeholder="e.g. Dr. Robert Chen" required>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.85rem; margin-bottom:0.85rem;">
          <div class="form-group">
            <label class="form-label" for="pharm-license">Drug License Number</label>
            <input type="text" id="pharm-license" class="form-control" placeholder="e.g. DL-2026-APX-7741" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="pharm-phone">Store Contact Phone</label>
            <input type="tel" id="pharm-phone" class="form-control" placeholder="+1-555-0188" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="pharm-email">Store Business Email</label>
          <input type="email" id="pharm-email" class="form-control" placeholder="store@apexhealth.example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="pharm-address">Full Physical Address</label>
          <input type="text" id="pharm-address" class="form-control" placeholder="Street, landmark, city, zipcode" required>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.85rem; margin-bottom:0.85rem;">
          <div class="form-group">
            <label class="form-label" for="pharm-hours">Operating Hours</label>
            <input type="text" id="pharm-hours" class="form-control" value="8:00 AM - 10:00 PM">
          </div>
          <div class="form-group">
            <label class="form-label" for="pharm-password">Portal Password</label>
            <input type="password" id="pharm-password" class="form-control" placeholder="••••••••" minlength="6" required>
          </div>
        </div>

        <div style="display:flex; gap:1.5rem; margin-bottom:1.5rem; background:var(--bg-subtle); padding:0.75rem 1rem; border-radius:var(--radius-md);">
          <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; cursor:pointer;">
            <input type="checkbox" id="pharm-24x7"> 24x7 Emergency Service
          </label>
          <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; cursor:pointer;">
            <input type="checkbox" id="pharm-delivery" checked> Supports Home Delivery
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; background:linear-gradient(135deg, #059669 0%, #047857 100%);">
          <i class="fa-solid fa-hospital-user"></i> Submit Pharmacy Verification & Register
        </button>
      </form>

      <div style="text-align:center; font-size:0.88rem; color:var(--text-muted); margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border-color);">
        Already have a pharmacy account? <a href="login.html" style="font-weight:700; color:var(--primary);">Sign In</a>
      </div>

    </div>
  </main>

  <script src="static/js/medifind-engine.js"></script>
  <script>
    function handlePharmacyPageRegister(e) {
      e.preventDefault();
      const pharmacyName = document.getElementById('pharm-name').value.trim();
      const ownerName = document.getElementById('pharm-owner').value.trim();
      const licenseNumber = document.getElementById('pharm-license').value.trim();
      const phone = document.getElementById('pharm-phone').value.trim();
      const email = document.getElementById('pharm-email').value.trim();
      const address = document.getElementById('pharm-address').value.trim();
      const openHours = document.getElementById('pharm-hours').value.trim();
      const password = document.getElementById('pharm-password').value;
      const is24x7 = document.getElementById('pharm-24x7').checked;
      const homeDelivery = document.getElementById('pharm-delivery').checked;

      const res = MediAuth.registerPharmacy({
        pharmacyName, ownerName, licenseNumber, phone, email, address, openHours, password, is24x7, homeDelivery
      });

      if (res.success) {
        MediUI.showToast(`Pharmacy "${res.pharmacy.name}" registered successfully!`, 'success');
        setTimeout(() => {
          window.location.href = 'dashboard_pharmacy.html';
        }, 800);
      } else {
        MediUI.showToast(res.message, 'error');
      }
    }
  </script>
</body>
</html>
