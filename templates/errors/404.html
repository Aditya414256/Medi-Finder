{% extends 'base.html' %}
{% block title %}Page Not Found (404) - MediFind{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <div style="font-size: 4rem; color: var(--primary); margin-bottom: 1rem;">
    <i class="fa-solid fa-file-circle-question"></i>
  </div>
  <h1 style="font-size: 2.2rem; margin-bottom: 0.75rem;">Page Not Found</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem;">
    The medicine, pharmacy, or page you are looking for might have been moved or does not exist.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center;">
    <a href="{{ url_for('customer.home') }}" class="btn btn-primary">Return Home</a>
    <a href="{{ url_for('customer.search') }}" class="btn btn-outline">Search Medicines</a>
  </div>
</div>
{% endblock %}
