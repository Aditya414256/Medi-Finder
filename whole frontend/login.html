<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - MediFind</title>
  <meta name="description" content="Sign in to your MediFind account to access prescriptions, verified pharmacies, and order tracking.">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="homepage/style.css">
  <link rel="stylesheet" href="static/css/medifind-theme.css">
</head>
<body style="background:var(--bg-main); min-height:100vh; display:flex; flex-direction:column;">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-staff-snake"></i></div>
        <span>MediFind</span>
      </a>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <!-- Login Main Content -->
  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:2.5rem 1rem;">
    <div style="width:100%; max-width:460px; background:#ffffff; border:1px solid var(--border-color); border-radius:var(--radius-lg); box-shadow:var(--shadow-xl); overflow:hidden;">
      
      <div style="text-align:center; padding:2rem 1.5rem 1rem;">
        <div class="brand-icon" style="margin:0 auto 1rem; width:48px; height:48px; font-size:1.3rem;">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2 style="font-size:1.6rem; margin-bottom:0.35rem; color:var(--text-main);">Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.88rem;">Sign in to access your prescriptions, pharmacy, or orders.</p>
      </div>

      <!-- Quick Demo Sign-in Box -->
      <div style="padding:0 1.75rem;">
        <div class="quick-demo-section">
          <span class="quick-demo-title"><i class="fa-solid fa-bolt text-warning"></i> 1-Click Instant Demo Login:</span>
          <div class="quick-demo-buttons">
            <button type="button" class="btn-demo-pill" onclick="MediUI.demoLogin('customer')">
              <i class="fa-solid fa-user"></i> Customer (John)
            </button>
            <button type="button" class="btn-demo-pill" onclick="MediUI.demoLogin('pharmacy')">
              <i class="fa-solid fa-prescription-bottle-medical"></i> Apollo Pharmacy
            </button>
            <button type="button" class="btn-demo-pill" onclick="MediUI.demoLogin('admin')">
              <i class="fa-solid fa-shield-halved"></i> Admin
            </button>
          </div>
        </div>
      </div>

      <div style="padding:0 1.75rem 2rem;">
        <div class="modal-divider"><span>OR SIGN IN WITH EMAIL</span></div>

        <form id="page-login-form" onsubmit="handlePageLogin(event)">
          <div class="form-group">
            <label class="form-label" for="login-email-page">Email Address</label>
            <input type="email" id="login-email-page" class="form-control" placeholder="name@example.com" required autofocus>
          </div>

          <div class="form-group" style="margin-bottom:1.25rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem;">
              <label class="form-label" for="login-password-page" style="margin-bottom:0;">Password</label>
              <a href="javascript:void(0)" onclick="alert('Demo Passwords:\nCustomer: Customer@12345\nPharmacy: Pharmacy@12345\nAdmin: Admin@12345')" style="font-size:0.8rem; font-weight:600;">Forgot Password?</a>
            </div>
            <input type="password" id="login-password-page" class="form-control" placeholder="••••••••" required>
          </div>

          <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1.5rem;">
            <input type="checkbox" id="remember-me" checked style="cursor:pointer;">
            <label for="remember-me" style="font-size:0.85rem; color:var(--text-muted); cursor:pointer;">Remember me on this browser</label>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
          </button>
        </form>
      </div>

      <div style="text-align:center; font-size:0.88rem; padding:1.25rem; background:var(--bg-subtle); border-top:1px solid var(--border-color); color:var(--text-muted);">
        Don't have an account? <a href="register.html" style="font-weight:700; color:var(--primary);">Sign Up</a> or <a href="register_pharmacy.html" style="font-weight:700; color:var(--accent);">Register Pharmacy</a>
      </div>

    </div>
  </main>

  <script src="static/js/medifind-engine.js"></script>
  <script>
    function handlePageLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email-page').value;
      const pass = document.getElementById('login-password-page').value;

      const res = MediAuth.login(email, pass);
      if (res.success) {
        MediUI.showToast(`Welcome back, ${res.user.name}!`, 'success');
        setTimeout(() => {
          if (res.user.role === 'admin') window.location.href = 'dashboard_admin.html';
          else if (res.user.role === 'pharmacy') window.location.href = 'dashboard_pharmacy.html';
          else window.location.href = 'index.html';
        }, 600);
      } else {
        MediUI.showToast(res.message, 'error');
      }
    }
  </script>
</body>
</html>
