{% extends 'base.html' %}
{% block title %}My Profile - MediFind{% endblock %}

{% block content %}
<div style="max-width: 580px; margin: 1.5rem auto;">
  <div class="card" style="box-shadow: var(--shadow-md);">
    <div class="card-header">
      <h2 style="font-size: 1.4rem;"><i class="fa-solid fa-id-card text-primary"></i> Profile & Account Information</h2>
    </div>

    <div class="card-body">
      <form method="POST" action="{{ url_for('customer.profile') }}">
        <div class="form-group">
          <label class="form-label">Account Role</label>
          <input type="text" class="form-control" value="{{ user.role|upper }}" disabled style="background: var(--bg-subtle);">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" value="{{ user.email }}" disabled style="background: var(--bg-subtle);">
          <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem;">Email cannot be changed directly.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="full_name">Full Name *</label>
          <input type="text" name="full_name" id="full_name" class="form-control" value="{{ user.full_name }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" name="phone" id="phone" class="form-control" value="{{ user.phone or '' }}" placeholder="+1 555-0199">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
